name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Cloud Run API origin, without a trailing slash
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate API origin
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: >-
          node --input-type=module -e
          "const value = process.env.VITE_API_BASE_URL;
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.username || url.password || url.origin !== value) {
            throw new Error('api_base_url must be an explicit HTTPS origin without a trailing slash');
          }"

      - name: Build GitHub Pages bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: npm run build -- --base /OralLens/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Publish GitHub Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
