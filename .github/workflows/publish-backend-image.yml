name: Publish backend image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/safkatul-islam/orallens-backend

jobs:
  publish:
    name: Build and publish CPU backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Safkatul-Islam/OralLens
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=orallens-backend
          cache-to: type=gha,mode=max,scope=orallens-backend

      - name: Record immutable image reference
        run: echo "${IMAGE_NAME}@${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
