server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # nginx inherits add_header from an outer level only when the current level
    # declares none of its own. Every location below sets its own Cache-Control,
    # which would silently discard server-level security headers. The three
    # security headers are therefore repeated per location on purpose. Do not
    # consolidate them into the server block, and repeat them in any new location.

    location = /health/live {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        default_type text/plain;
        return 200 "live\n";
    }

    location = /runtime-config.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =503;
    }

    # Cache-Control deliberately omits "always" so a missing asset returns 404
    # without a one-year immutable directive.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
