[data]
dataset_root = "ml/data/raw/orthodontic_plaque/v3/extracted/part-2/mendeley-dataset-materials_Part_2"
manifest_path = "ml/data/prepared/orthodontic_plaque/v3/part-2/manifest.csv"

[model]
checkpoint_path = "ml/runs/detection/orthodontic_plaque_part2_smoke/checkpoint_last.pt"
num_classes = 2
image_min_size = 256
image_max_size = 384
trainable_backbone_layers = 0
pretrained_weights = "none"

[evaluation]
split = "validation"
batch_size = 1
num_workers = 0
device = "cpu"
iou_thresholds = [0.5]
score_thresholds = [0.05, 0.5]
max_batches = 1

[output]
output_dir = "ml/runs/detection/orthodontic_plaque_part2_smoke_eval"
