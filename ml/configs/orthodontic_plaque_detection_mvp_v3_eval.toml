[data]
dataset_root = "ml/data/raw/orthodontic_plaque/v3/extracted/part-2/mendeley-dataset-materials_Part_2"
manifest_path = "ml/data/prepared/orthodontic_plaque/v3/part-2/manifest.csv"

[model]
checkpoint_path = "ml/runs/detection/orthodontic_plaque_part2_mvp_v3/checkpoint_best.pt"
num_classes = 2
image_min_size = 512
image_max_size = 768
trainable_backbone_layers = 3
pretrained_weights = "none"

[evaluation]
split = "validation"
batch_size = 1
num_workers = 0
device = "auto"
iou_thresholds = [0.5]
score_thresholds = [
    0.05,
    0.075,
    0.1,
    0.125,
    0.15,
    0.175,
    0.2,
    0.225,
    0.25,
    0.3,
    0.35,
    0.4,
    0.45,
    0.5,
    0.55,
    0.6,
    0.65,
    0.7,
    0.75,
    0.8,
    0.85,
    0.9,
    0.95,
]

[output]
output_dir = "ml/runs/detection/orthodontic_plaque_part2_mvp_v3_eval"
