[model]
model_name = "orthodontic-plaque-mvp-v3"
checkpoint_path = "ml/runs/detection/orthodontic_plaque_part2_mvp_v3/checkpoint_best.pt"
num_classes = 2
image_min_size = 512
image_max_size = 768
trainable_backbone_layers = 3
pretrained_weights = "none"

[inference]
device = "auto"
score_threshold = 0.85
max_detections = 25

[input_policy]
enabled = true
min_short_side = 256
max_pixels = 30000000
min_mean_luminance = 0.05
max_mean_luminance = 0.98
min_luminance_stddev = 0.02

[output]
output_dir = "ml/runs/detection/orthodontic_plaque_part2_mvp_v3_predictions"
