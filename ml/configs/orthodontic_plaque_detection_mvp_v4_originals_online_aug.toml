[data]
dataset_root = "ml/data/raw/orthodontic_plaque/v3/extracted/part-2/mendeley-dataset-materials_Part_2"
manifest_path = "ml/data/prepared/orthodontic_plaque/v4/part-2/manifest.csv"
variant = "original"
excluded_sample_id_suffixes = ["_blur", "_dark", "_light"]

[model]
num_classes = 2
image_min_size = 512
image_max_size = 768
trainable_backbone_layers = 3
pretrained_weights = "default"

[training]
epochs = 16
batch_size = 1
learning_rate = 0.005
momentum = 0.9
weight_decay = 0.0005
num_workers = 0
device = "cuda"
seed = 20260711

[augmentation]
enabled = true
horizontal_flip_probability = 0.5
color_jitter_probability = 0.8
brightness = 0.12
contrast = 0.12
saturation = 0.08
hue = 0.02
gaussian_blur_probability = 0.0
gaussian_blur_kernel_size = 3
gaussian_blur_sigma_min = 0.1
gaussian_blur_sigma_max = 1.0

[output]
output_dir = "ml/runs/detection/orthodontic_plaque_part2_mvp_v4_originals_online_aug"
