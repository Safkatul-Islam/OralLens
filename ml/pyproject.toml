[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "orallens-ml"
version = "0.1.0"
description = "Reproducible machine-learning pipeline for OralLens AI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow==12.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
training = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
